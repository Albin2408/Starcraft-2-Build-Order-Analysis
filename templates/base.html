<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}SC2 Build Analyzer{% endblock %}</title>
<link rel="icon" type="image/png" href="{{ url_for('static', filename='img/starcraft2_logo.png') }}">
<style>
  :root {
    --bg: #0f1420;
    --panel: #171d2e;
    --panel-border: #2a3350;
    --text: #e7ebf5;
    --muted: #93a0c2;
    --accent: #4da3ff;
    --win: #3ecf8e;
    --loss: #ff6b6b;
    --pro: #f5c451;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    margin: 0;
  }
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 32px;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }
  nav .brand {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
  }
  nav .brand img {
    height: 30px;
    width: auto;
    object-fit: contain;
    display: block;
  }
  nav a {
    color: var(--muted);
    text-decoration: none;
    margin-left: 20px;
    font-size: 14px;
  }
  nav a:hover { color: var(--text); }
  .container { padding: 32px; max-width: 1000px; margin: 0 auto; }
  .race-icon {
    height: 1.2em;
    width: 1.2em;
    object-fit: contain;
    vertical-align: -0.25em;
    margin-right: 4px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    padding: 24px;
  }
  input[type=text], input[type=password] {
    width: 100%;
    padding: 10px 12px;
    margin: 6px 0 16px;
    background: #0f1420;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 14px;
  }
  label { font-size: 13px; color: var(--muted); }
  button, input[type=submit] {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover, input[type=submit]:hover { opacity: 0.9; }
  .error { color: var(--loss); font-size: 13px; margin-bottom: 12px; }
  .message { color: var(--win); font-size: 13px; margin-bottom: 12px; }
  a.link { color: var(--accent); }
</style>
</head>
<body>
<nav>
  <div class="brand">
    <img src="{{ url_for('static', filename='img/starcraft2_logo.png') }}" alt="StarCraft II">
    <span>Build Analyzer{% if display_name %} &mdash; {{ display_name }}{% endif %}</span>
  </div>
  <div>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('games') }}">Game log</a>
    <a href="{{ url_for('upload') }}">Upload my replays</a>
    <a href="{{ url_for('upload_pro') }}">Upload pro pool</a>
    <a href="{{ url_for('settings') }}">Settings</a>
  </div>
</nav>
<div class="container">
  {% block content %}{% endblock %}
</div>
</body>
</html>
